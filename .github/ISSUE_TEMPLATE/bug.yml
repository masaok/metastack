name: Bug report
description: Something in the app is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 131 on macOS 15
  - type: textarea
    id: export
    attributes:
      label: Progress export (optional)
      description: If the bug involves scheduling, paste the relevant part of your Settings → Export JSON. It contains no personal data.
